<form action="page2.html">
    <label for="firstName">First Name: </label>
  
    <input type="text" placeholder="Enter Your Name Ya user" id="firstName" name="firstName" required><br><br>

    <label for="last Name">Last Name: </label>
  
    <input type="text" placeholder="Enter Your Name Ya user" id="last Name" name="lastName"><br><br>

    <label for="age">Age: </label>
  
    <input type="number" placeholder="Enter Your Name Ya user" id="age" min="1" max="100" name="age"><br><br>

    <label for="email">email: </label>
  
    <input type="email" placeholder="Enter Your Name Ya user" id="email" min="1" max="100" name="email"><br><br>

    <label for="bDate">bDate: </label>
  
    <input type="date" placeholder="Enter Your Name Ya user" id="bDate" min="1" max="100" name="bDate"><br><br>

    <label for="Password">Password: </label>
  
    <input type="password" placeholder="Enter Your Name Ya user" id="Password" min="1" max="100" name="Password"><br><br>


    <label for="Gender">Gender</label>
    <br>
    <label for="male">male</label>
 
    <input type="radio" name="gender" id="male" value="male"><br>

    <input type="radio" name="gender" id="female" value="female">
